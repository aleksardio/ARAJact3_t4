<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/comun :: head('Categorías')}"></head><body>
<header th:replace="~{fragments/comun :: navegacion('categorias')}"></header><main class="contenedor">
<div class="encabezado"><div><p class="eyebrow">CONTROL ACADÉMICO / CATEGORÍAS</p><h1>Categorías</h1><p class="subtitulo">Organiza tus materias por área de conocimiento.</p></div><a class="boton primario" th:href="@{/categorias/nueva}">+ Nueva categoría</a></div>
<div th:replace="~{fragments/comun :: mensajes}"></div>
<section class="tarjeta tabla-tarjeta"><div class="tabla-cabecera"><div><h2>Áreas académicas</h2><p th:text="${#lists.size(categorias)} + ' categoría(s)'">0 categorías</p></div></div>
<div class="tabla-scroll" th:unless="${#lists.isEmpty(categorias)}"><table><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Materias</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="categoria : ${categorias}"><td class="atenuado" th:text="${categoria.id}"></td><td class="nombre-tabla" th:text="${categoria.nombre}"></td><td th:text="${categoria.descripcion == null or #strings.isEmpty(categoria.descripcion) ? '—' : categoria.descripcion}"></td><td><span class="etiqueta" th:text="${cantidades[categoria.id] == null ? 0 : cantidades[categoria.id]}"></span></td><td><div class="acciones"><a class="accion" th:href="@{/categorias/{id}/editar(id=${categoria.id})}">Editar</a><form method="post" th:action="@{/categorias/{id}/eliminar(id=${categoria.id})}" onsubmit="return confirm('¿Deseas eliminar esta categoría?');"><button class="accion peligro" type="submit">Eliminar</button></form></div><small class="ayuda" th:if="${cantidades[categoria.id] != null and cantidades[categoria.id] > 0}">No se puede eliminar: contiene materias.</small></td></tr>
</tbody></table></div><div class="vacio" th:if="${#lists.isEmpty(categorias)}">No hay categorías registradas. Crea una para organizar tus materias.</div></section>
</main><footer th:replace="~{fragments/comun :: pie}"></footer></body></html>
